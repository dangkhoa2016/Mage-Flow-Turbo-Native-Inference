name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .
      - name: Unit and contract tests
        run: python3 -m pytest tests/ -q
      - name: Python syntax
        run: python3 -m compileall -q mageflow_native integrations scripts
      - name: Shell syntax
        run: |
          for f in $(find scripts -type f -name '*.sh'); do bash -n "$f"; done
      - name: Notebook JSON
        run: python3 -m json.tool notebooks/kaggle-production-demo.ipynb >/dev/null
      - name: Publication surface audit
        run: python3 scripts/publication/audit_public_surface.py --root .
      - name: Public history invariants
        run: python3 scripts/publication/verify_history.py . --branch HEAD
      - name: Release contract audit
        run: python3 scripts/publication/audit_release_contract.py
      - name: No model weights in Git tree
        run: |
          if find . -type f \
              \( -name '*.gguf' -o -name '*.safetensors' -o -name '*.ckpt' -o -name '*.pt' -o -name '*.pth' -o -name '*.onnx' \) \
              -print -quit | grep -q .; then
            echo 'Model/runtime weight file is forbidden in the source repository.' >&2
            exit 1
          fi
